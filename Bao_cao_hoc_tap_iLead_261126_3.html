<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo học tập iLead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Hướng thiết kế: nền ấm theo màu logo IPA Group (cát và xanh đá), bảng số liệu là trung tâm, một sắc xanh đá cho mức độ. */
:root {
  --bg: #F6F3EE;
  --surface: #FFFFFF;
  --ink: #1E2B34;
  --muted: #5F6F7A;
  --line: #E3DDD3;
  --slate: #59798F;
  --slate-ink: #3E5A6D;
  --tan: #D2BEA5;
  --tan-soft: #EFE6D8;
  --track: #E6E0D6;
  --ok-bg: #DDF0E3;
  --ok-ink: #1B5E36;
  --no-bg: #F8DEDC;
  --no-ink: #8E2B25;
  --focus: #B8860B;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151C21; --surface: #1D272E; --ink: #E8E4DC; --muted: #9FB0BA; --line: #2C3841;
    --slate: #7FA3BA; --slate-ink: #A9C4D4; --tan: #6E6250; --tan-soft: #2A2823; --track: #2C3841;
    --ok-bg: #1F3A2B; --ok-ink: #8FD3A8; --no-bg: #43231F; --no-ink: #F0A9A2; --focus: #E3B341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151C21; --surface: #1D272E; --ink: #E8E4DC; --muted: #9FB0BA; --line: #2C3841;
  --slate: #7FA3BA; --slate-ink: #A9C4D4; --tan: #6E6250; --tan-soft: #2A2823; --track: #2C3841;
  --ok-bg: #1F3A2B; --ok-ink: #8FD3A8; --no-bg: #43231F; --no-ink: #F0A9A2; --focus: #E3B341;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 12px 20px 0; }
.brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo-plate { background: #fff; border-radius: 10px; padding: 4px 8px; display: flex; border: 1px solid var(--line); }
.logo-plate img { height: 44px; width: auto; display: block; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em; text-wrap: balance; color: var(--slate-ink); }
.brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: thin; }
nav.tabs button { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--slate-ink); border-bottom-color: var(--slate); }
nav.tabs .sep { width: 1px; background: var(--line); margin: 8px 8px; flex: none; }

main { max-width: 1280px; margin: 0 auto; padding: 22px 20px 48px; }
section.panel[hidden] { display: none; }
h2 { font-size: 22px; margin: 0 0 4px; font-weight: 700; text-wrap: balance; color: var(--slate-ink); }
h3 { font-size: 15px; margin: 28px 0 10px; font-weight: 700; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 13.5px; max-width: 80ch; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); gap: 12px; margin-bottom: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile .lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tile .big { font-size: 28px; font-weight: 700; color: var(--slate-ink); line-height: 1.15; margin: 2px 0 6px; }
.tile .det { font-size: 12px; color: var(--muted); margin-top: 6px; }
.tile.first { background: var(--tan-soft); border-color: var(--tan); }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--slate); border-radius: 3px; }

.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
.tablewrap.tall { max-height: 68vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--tan-soft); color: var(--ink); font-weight: 600; font-size: 12.5px; z-index: 2; white-space: nowrap; vertical-align: bottom; }
th.c, td.c { text-align: center; }
th.lesson { white-space: normal; min-width: 96px; max-width: 110px; line-height: 1.25; padding-left: 3px; padding-right: 3px; }
td.lesson { padding-left: 3px; padding-right: 3px; }
th.r, td.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--tan-soft) 55%, transparent); }
tr.total td { font-weight: 700; background: var(--tan-soft); }
td.heat { text-align: center; font-weight: 600; }
td.name { font-weight: 600; }
td.name.wrap { min-width: 140px; }
td.wrap { white-space: normal; min-width: 160px; }

.pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.no { background: var(--no-bg); color: var(--no-ink); }
.pill::before { content: "✓ "; }
.pill.no::before { content: "○ "; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 0 0 12px; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 500; }
.filters input, .filters select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 150px; }
.filters input.q { min-width: 260px; }
.pager { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pager button { font: inherit; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--slate-ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.pager button:disabled { opacity: .45; cursor: default; }
.pager .info { margin-left: auto; }

.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; font-size: 13.5px; }
.notes ol { margin: 6px 0 0; padding-left: 20px; }
.notes li { margin: 3px 0; max-width: 90ch; }

/* tra cứu */
.lookup { max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px 22px; }
.lookup h2 { font-size: 26px; }
.lookup .hint { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
.lookup .row { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; align-items: center; margin-bottom: 10px; }
.lookup .k { color: var(--muted); }
.lookup .v { font-weight: 700; min-height: 1.5em; }
.lookup .u { font-weight: 700; }
#lk-input { font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); background: #FFF9C4; border: 2px solid #F5A623; border-radius: 8px; padding: 10px 12px; width: 100%; }
:root[data-theme="dark"] #lk-input { background: #3A3520; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #lk-input { background: #3A3520; } }
.lookup table { margin-top: 6px; }
.lookup th { background: none; border-bottom: 2px solid var(--slate); color: var(--muted); position: static; padding-left: 0; }
.lookup td { padding-left: 0; font-size: 14.5px; }
.lookup .foot { font-style: italic; color: var(--muted); font-size: 12.5px; margin: 16px 0 0; }
.lookup .msg { color: var(--no-ink); font-weight: 600; }
footer { max-width: 1280px; margin: 0 auto; padding: 0 20px 36px; color: var(--muted); font-size: 12px; }

@media (max-width: 640px) {
  .top-inner, main, footer { padding-left: 14px; padding-right: 14px; }
  .lookup { padding: 18px 16px; }
  .lookup .row { grid-template-columns: 1fr; }
  .filters input.q { min-width: 0; width: 100%; }
}
</style>
</head>

function statsOf(rows) {
  const c = [0, 0, 0, 0, 0, 0];
  for (const r of rows) for (let i = 0; i < 6; i++) if (r[6][i] === '1') c[i]++;

    <h2>Tra cứu kết quả của bạn</h2>
    <p class="hint">Nhập username đăng nhập LMS hoặc mã nhân viên vào ô vàng bên dưới rồi nhấn Enter (ví dụ: nguyen.vana, pti\\nguyenva hoặc HR26001271).</p>
    <div class="row"><label class="u" for="lk-input">Username</label><input id="lk-input" type="text" autocomplete="off" spellcheck="false" placeholder="Nhập username hoặc mã nhân viên"></div>
    <div class="row"><span class="k">Họ và tên</span><span class="v" id="lk-name"></span></div>
    <div class="row"><span class="k">SBU</span><span class="v" id="lk-sbu"></span></div>
    <div class="row"><span class="k">Tiến độ</span><span class="v num" id="lk-prog"></span></div>
    <table aria-label="Kết quả từng khóa học"><thead><tr><th>Khóa học</th><th>Trạng thái</th></tr></thead>
      <tbody>${LOOKUP_ORDER.map((c, i) => `<tr><td>${esc(c[1])}</td><td id="lk-s${i}"></td></tr>`).join('')}</tbody></table>
    <p class="foot">"Chưa hoàn thành" gồm khóa đang học dở và khóa chưa vào học. Nếu kết quả chưa đúng, vui lòng liên hệ iLead Partner hỗ trợ.</p>
  </div>`;
  const inp = el.querySelector('#lk-input');
  const $ = id => el.querySelector('#' + id);
  function run() {
    const q = inp.value.trim().toLowerCase();
    const hit = q ? INDEX.get(q) : null;
    for (let i = 0; i < 6; i++) $('lk-s' + i).innerHTML = '';
    $('lk-sbu').textContent = ''; $('lk-prog').textContent = '';
    if (!q) { $('lk-name').textContent = ''; return; }
    if (!hit) { $('lk-name').innerHTML = '<span class="msg">Không tìm thấy. Vui lòng kiểm tra lại username hoặc mã nhân viên.</span>'; return; }
    const [sbu, r] = hit;
    $('lk-name').textContent = r[2]; $('lk-sbu').textContent = r[3];
    let done = 0;
    LOOKUP_ORDER.forEach((c, i) => {
      const ok = r[6][c[0]] === '1'; if (ok) done++;
      $('lk-s' + i).innerHTML = `<span class="pill ${ok ? 'ok' : 'no'}">${ok ? 'Hoàn thành' : 'Chưa hoàn thành'}</span>`;
    });
    $('lk-prog').textContent = done + '/6 khóa học đã hoàn thành';
  }
  inp.addEventListener('input', run);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}

/* ---- Tab từng SBU ---- */
function buildSbu(sbu) {
  return el => {
    const rows = DATA[sbu];
    const keys = rows.map(r => fold(r[0] + ' ' + r[1] + ' ' + r[2]));
    const khoiList = [...new Set(rows.map(r => r[4] || '(Chưa có)'))].sort((a, b) => a.localeCompare(b, 'vi'));
    const st = STATS[sbu];
    const chips = `<div class="tiles">
      <div class="tile first"><div class="lbl">Số nhân sự ${sbu}</div><div class="big num">${fmt(st.n)}</div></div>` +
      COURSES.map((c, i) => `<div class="tile"><div class="lbl">${esc(c)}</div><div class="big num">${pct(st.c[i] / st.n)}</div><div class="bar" role="img" aria-label="${pct(st.c[i] / st.n)}"><i style="width:${st.c[i] / st.n * 100}%"></i></div><div class="det num">${fmt(st.c[i])} / ${fmt(st.n)} CBNV</div></div>`).join('') + '</div>';
    el.innerHTML = `<h2>${sbu}: kết quả học tập từng CBNV</h2>
      <p class="sub">Mỗi dòng là một CBNV. Dùng ô tìm kiếm để tìm theo tên, mã nhân viên hoặc username.</p>
      ${chips}
      <div class="filters" style="margin-top:18px">
        <label>Tìm kiếm<input class="q" id="${sbu}-q" type="search" placeholder="Tên, mã nhân viên hoặc username"></label>
        <label>Khối<select id="${sbu}-k"><option value="">Tất cả khối</option>${khoiList.map(k => `<option>${esc(k)}</option>`).join('')}</select></label>
        <label>Bài học<select id="${sbu}-c"><option value="">Tất cả bài</option>${COURSES.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('')}</select></label>
        <label>Trạng thái bài<select id="${sbu}-s"><option value="">Tất cả</option><option value="1">Hoàn thành</option><option value="0">Chưa hoàn thành</option></select></label>
      </div>
      <div class="tablewrap tall"><table><thead><tr><th class="r">STT</th><th>Mã nhân viên</th><th>Họ và tên</th><th>SBU</th>${COURSES.map(c => `<th class="c lesson">${esc(c)}</th>`).join('')}<th class="c">Số bài hoàn thành</th><th>Khối</th><th>Phòng ban</th></tr></thead><tbody id="${sbu}-body"></tbody></table></div>
      <div class="pager"><button type="button" id="${sbu}-prev">Trang trước</button><button type="button" id="${sbu}-next">Trang sau</button><span id="${sbu}-pg"></span><span class="info" id="${sbu}-info"></span></div>`;
    const $ = id => el.querySelector('#' + sbu + '-' + id);
    let page = 0, list = [];
    function filter() {
      const f = fold($('q').value.trim()), k = $('k').value, c = $('c').value, s = $('s').value;
      list = [];
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        if (f && !keys[i].includes(f)) continue;
        if (k && (r[4] || '(Chưa có)') !== k) continue;
        if (c !== '' && s !== '' && r[6][+c] !== s) continue;
        list.push(r);
      }
      page = 0; render();
    }
    function render() {
      const pages = Math.max(1, Math.ceil(list.length / PAGE));
      const slice = list.slice(page * PAGE, page * PAGE + PAGE);
      $('body').innerHTML = slice.map((r, j) => {
        const done = [...r[6]].filter(x => x === '1').length;
        return `<tr><td class="r num">${page * PAGE + j + 1}</td><td class="num">${esc(r[0])}</td><td class="name">${esc(r[2])}</td><td>${esc(r[3])}</td>${[...r[6]].map(x => `<td class="c lesson"><span class="pill ${x === '1' ? 'ok' : 'no'}">${x === '1' ? 'Hoàn thành' : 'Chưa hoàn thành'}</span></td>`).join('')}<td class="c num"><b>${done}</b></td><td class="wrap">${esc(r[4])}</td><td class="wrap">${esc(r[5])}</td></tr>`;
      }).join('') || '<tr><td colspan="13">Không có CBNV phù hợp với bộ lọc.</td></tr>';
      $('pg').textContent = 'Trang ' + (page + 1) + ' / ' + pages;
      $('prev').disabled = page === 0; $('next').disabled = page >= pages - 1;
      const from = list.length ? page * PAGE + 1 : 0;
      $('info').textContent = 'Hiển thị ' + fmt(from) + '–' + fmt(Math.min(list.length, (page + 1) * PAGE)) + ' trong ' + fmt(list.length) + ' CBNV';
      el.querySelector('.tablewrap').scrollTop = 0;
    }
    $('q').addEventListener('input', filter); $('k').addEventListener('change', filter);
    $('c').addEventListener('change', filter); $('s').addEventListener('change', filter);
    $('prev').addEventListener('click', () => { if (page > 0) { page--; render(); } });
    $('next').addEventListener('click', () => { page++; render(); });
    filter();
  };
}

const BUILD = {
  'tong-quan': buildOverview, 'tra-cuu': buildLookup,
  'vnds': buildSbu('VNDS'), 'pti': buildSbu('PTI'), 'ipas': buildSbu('IPAS'), 'ipag': buildSbu('IPAG'), 'anvie': buildSbu('Anvie')
};
show(location.hash.slice(1));
</script>
